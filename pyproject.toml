[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-football-agentic"
version = "0.2.0"
description = "An agentic football simulation game, developed incrementally."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "google-genai==2.23.0",
    "groq==1.7.0",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
