[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-football-agentic"
version = "0.1.0"
description = "An agentic football simulation game, developed incrementally."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "groq",
    "jinja2",
    "pydantic",
    "python-dotenv",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
